services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "989"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8080:8080"
    command:
      [
        "-hf", "unsloth/Qwen3.5-9B-GGUF:UD-Q4_K_XL",
        "-ngl", "99",
        "-c", "8192",
        "--host", "0.0.0.0",
        "--port", "8080",
      ]

  app:
    build: .
    image: recipe-rag-app
    environment:
      GENERATOR_BASE_URL: http://llm:8080/v1
    volumes:
      - ./data:/app/data
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8000:8000"
    shm_size: 512m
    depends_on:
      - llm

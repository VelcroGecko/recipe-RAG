[project]
name = "recipe-rag"
version = "0.1.0"
description = "RAG over recipes: Ray Serve + llama.cpp + FAISS"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "numpy>=2.3.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.13.0",
    "ray[serve]>=2.59.0",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_rag"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
